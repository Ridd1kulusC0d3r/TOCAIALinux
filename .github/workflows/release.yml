name: release
# Crie uma tag (ex.: v1.0.0) e este workflow publica:
#   imagem multi-arquitetura no GHCR, tarball do WSL, as .pyz e a ISO live.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: imagem amd64 + arm64
        run: |
          IMG=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build -f container/Dockerfile --platform linux/amd64,linux/arm64 \
            -t "$IMG:${{ github.ref_name }}" -t "$IMG:latest" --push .
      - name: tarball WSL + pyz
        run: |
          sh container/exportar-wsl.sh
          python3 build.py
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            tocaia-wsl.tar
            dist/*.pyz
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: construir ISO dentro de um Debian trixie
        run: |
          docker run --rm --privileged -v "$PWD":/src -w /src debian:trixie sh -c '
            apt-get update && apt-get install -y live-build python3 &&
            sh iso/construir-iso.sh'
      - run: sha256sum iso/*.iso > iso/SHA256SUMS && ls -lh iso/*.iso
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            iso/*.iso
            iso/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with: { name: tocaia-iso, path: iso/*.iso, retention-days: 7 }
